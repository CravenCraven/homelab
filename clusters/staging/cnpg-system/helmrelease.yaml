apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"   # installs CloudNativePG 1.30.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
