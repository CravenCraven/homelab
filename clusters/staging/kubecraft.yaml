apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kubecraft
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/CravenCraven/homelab-kubecraft
  ref:
    branch: main
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubecraft
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubecraft
